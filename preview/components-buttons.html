<!DOCTYPE html>
<!-- @dsCard group="Components" name="CTA buttons" subtitle="Red / blue / ghost · sharp corners" viewport="700x150" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 28px 32px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .cta { font-family: var(--font-mono); font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; font-size: 13px; min-height: 52px; padding: 0 28px; display: inline-flex; align-items: center; gap: 12px; cursor: pointer; border: none; transition: all 0.2s; }
  .red { background: var(--swiss-red); color: #fff; }
  .red:hover { background: var(--swiss-red-dark); transform: translateY(-1px); }
  .blue { background: var(--brand); color: #fff; }
  .blue:hover { background: var(--brand-dark); }
  .ghost { background: transparent; color: var(--brand); border: 1px solid var(--line-strong); }
  .ghost:hover { background: var(--brand); color: #fff; }
  .nav { background: var(--swiss-red); color: #fff; min-height: 40px; padding: 0 16px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; margin-top: 26px; }
</style>
</head>
<body>
  <div class="row">
    <button class="cta red">Aussteller werden <span>→</span></button>
    <button class="cta blue">Feedback teilen <span>→</span></button>
    <button class="cta ghost">Mehr erfahren</button>
    <button class="cta nav">Aussteller →</button>
  </div>
  <div class="meta">Mono 700 UPPERCASE · sharp corners · red = top-priority CTA · hover darkens + nudges</div>
</body>
</html>
