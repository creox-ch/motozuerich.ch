<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Ghost numeral & gradient" subtitle="Diagonal hero gradient + ghost year" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; }
  .stage { position: relative; height: 220px; background: linear-gradient(135deg, var(--brand-darker) 0%, var(--brand) 60%, var(--brand-dark) 100%); overflow: hidden; display: flex; align-items: center; padding: 0 32px; }
  .ghost { position: absolute; right: -1vw; bottom: -4vw; font-family: var(--font-display); font-weight: 700; font-size: 320px; color: rgba(255,255,255,0.06); line-height: 0.8; letter-spacing: -0.04em; pointer-events: none; }
  .bar { position: absolute; top: 0; left: 0; bottom: 0; width: 6px; background: linear-gradient(180deg, var(--brand) 0%, var(--brand-light) 50%, var(--action-yellow) 100%); }
  .eyebrow { font-family: var(--font-mono); font-weight: 700; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--brand-light); position: relative; }
  .meta { position: absolute; bottom: 14px; left: 32px; font-family: var(--font-mono); font-size: 11px; color: rgba(255,255,255,0.55); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="stage">
    <div class="bar"></div>
    <div class="ghost">2027</div>
    <div class="eyebrow">Ghost numeral · 4–6% white · clipped</div>
    <div class="meta">Diagonal blue gradient · 6px accent edge bar · oversized year/monogram motif</div>
  </div>
</body>
</html>
