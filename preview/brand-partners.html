<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Partner & media logos" subtitle="Sponsor / media logo strip" viewport="700x120" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 24px 32px; }
  .lbl { font-family: var(--font-mono); font-weight: 700; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--brand); margin-bottom: 20px; }
  .strip { display: flex; align-items: center; gap: 38px; flex-wrap: wrap; }
  .strip img { height: 30px; max-width: 130px; object-fit: contain; }
  .wordmark { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; color: var(--fg); }
</style>
</head>
<body>
  <div class="lbl">Partner &amp; Medien</div>
  <div class="strip">
    <img src="../assets/partners/Allianz.svg" alt="Allianz" />
    <img src="../assets/partners/blick-logo.svg" alt="Blick" />
    <img src="../assets/partners/MotoScout24.svg" alt="MotoScout24" />
    <span class="wordmark">moto-lifestyle</span>
    <img src="../assets/partners/Radio-Zurisee.svg" alt="Radio Zürisee" />
    <img src="../assets/partners/Radio-Switzerland-Virgin.svg" alt="Radio Switzerland" />
    <img src="../assets/partners/Radio-Argovva.svg" alt="Radio Argovia" />
  </div>
</body>
</html>
