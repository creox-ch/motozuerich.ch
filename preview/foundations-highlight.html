<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Highlight plates" subtitle="Wipe-in marker plates on headlines" viewport="700x195" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 30px 32px; }
  .h { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1.25; letter-spacing: -0.01em; text-transform: uppercase; color: var(--fg); }
  .hl, .hl-soft, .hl-yellow { display: inline-block; padding: 0.08em 0.28em; line-height: 1; font-weight: 700; }
  .hl { color: #fff; background: var(--brand); }
  .hl-soft { color: var(--brand-dark); background: var(--brand-soft); }
  .hl-yellow { color: #282424; background: var(--action-yellow); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; margin-top: 24px; }
</style>
</head>
<body>
  <div class="h">Die <span class="hl">MOTO-ZÜRICH</span><br />auf einen <span class="hl-yellow">Blick</span> — <span class="hl-soft">2027</span></div>
  <div class="meta">Highlight plates: plate wipes in (scaleX), then letters type in · brand / soft / yellow</div>
</body>
</html>
