<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Accents & ink" subtitle="Swiss red, action yellow, foreground, muted" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-mono); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); }
  .sw { height: 200px; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; color: #fff; }
  .name { font-weight: 700; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
  .hex { font-size: 12px; opacity: 0.85; margin-top: 4px; }
  .role { font-family: var(--font-body); font-size: 11px; opacity: 0.8; margin-top: 8px; line-height: 1.3; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--swiss-red);">
      <div class="name">Swiss Red</div><div class="hex">#C10D0D</div>
      <div class="role">Primary CTA only</div>
    </div>
    <div class="sw" style="background: var(--action-yellow); color: #282424;">
      <div class="name">Action Yellow</div><div class="hex">#FAF143</div>
      <div class="role">Action Zone · highlight</div>
    </div>
    <div class="sw" style="background: var(--fg);">
      <div class="name">Foreground</div><div class="hex">#282424</div>
      <div class="role">Body ink (warm black)</div>
    </div>
    <div class="sw" style="background: var(--muted);">
      <div class="name">Muted</div><div class="hex">#6B7280</div>
      <div class="role">Labels · captions</div>
    </div>
  </div>
</body>
</html>
