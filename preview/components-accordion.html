<!DOCTYPE html>
<!-- @dsCard group="Components" name="Programme accordion" subtitle="Collapsible programme list" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 24px 32px; }
  .acc { border: 1px solid var(--line); margin-bottom: 10px; }
  summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 18px; padding: 20px 22px; }
  summary::-webkit-details-marker { display: none; }
  .side { font-family: var(--font-mono); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: #fff; background: var(--brand); padding: 5px 10px; }
  .side.action { background: var(--action-yellow); color: #282424; }
  .title { font-family: var(--font-display); font-weight: 700; font-size: 18px; text-transform: uppercase; color: var(--fg); }
  .toggle { margin-left: auto; font-family: var(--font-mono); font-size: 20px; color: var(--brand); }
  .item { display: flex; gap: 14px; padding: 14px 22px; border-top: 1px solid var(--line); }
  .inum { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--brand); }
  .iname { font-family: var(--font-body); font-weight: 700; font-size: 14px; color: var(--fg); }
  .idesc { font-family: var(--font-body); font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <div class="acc">
    <details open>
      <summary><span class="side">Live Arena</span><span class="title">10 Programme · ~35 Auftritte</span><span class="toggle">–</span></summary>
      <div class="item"><span class="inum">01</span><div><div class="iname">Suse Mühlemeier · „Building Speed"</div><div class="idesc">Frauen, Technik &amp; Rennsport – Stories aus Boxengasse und Paddock.</div></div></div>
    </details>
  </div>
  <div class="acc">
    <details>
      <summary><span class="side action">Action Zone</span><span class="title">7 Shows · 49 Auftritte</span><span class="toggle">+</span></summary>
    </details>
  </div>
</body>
</html>
