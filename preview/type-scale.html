<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type scale" subtitle="Fluid clamp() display scale" viewport="700x250" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 24px 32px; }
  .r { display: flex; align-items: baseline; gap: 18px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .r:last-child { border-bottom: none; }
  .spec { font-family: var(--font-display); font-weight: 700; color: var(--fg); line-height: 1; white-space: nowrap; }
  .info { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; margin-left: auto; }
</style>
</head>
<body>
  <div class="r"><span class="spec" style="font-size:54px;">Hero / Claim</span><span class="info">clamp 64→180px</span></div>
  <div class="r"><span class="spec" style="font-size:40px;">Section Title</span><span class="info">clamp 44→92px</span></div>
  <div class="r"><span class="spec" style="font-size:28px;">Sub-headline</span><span class="info">clamp 32→52px</span></div>
  <div class="r"><span class="spec" style="font-size:34px; color: var(--brand);">22'117</span><span class="info">Stat · clamp 56→84px</span></div>
  <div class="r"><span class="spec" style="font-size:22px;">Card Title</span><span class="info">34px · uppercase</span></div>
</body>
</html>
