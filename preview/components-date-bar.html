<!DOCTYPE html>
<!-- @dsCard group="Components" name="Date-bar marquee" subtitle="Sticky infinite ticker" viewport="700x120" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); }
  .bar { background: var(--brand); color: #fff; padding: 13px 0; font-family: var(--font-mono); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; overflow: hidden; border-bottom: 1px solid var(--brand-dark); }
  .track { display: flex; gap: 48px; white-space: nowrap; animation: scroll 30s linear infinite; }
  .track span { display: inline-flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .track span::before { content: "●"; color: #fff; font-size: 8px; opacity: 0.7; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .note { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; padding: 24px 32px; }
</style>
</head>
<body>
  <div class="bar">
    <div class="track">
      <span>MOTO-ZÜRICH 2027</span><span>19.–21. Februar 2027</span><span>Wird grösser</span><span>Save the Date</span>
      <span>MOTO-ZÜRICH 2027</span><span>19.–21. Februar 2027</span><span>Wird grösser</span><span>Save the Date</span>
    </div>
  </div>
  <div class="note">Sticky date bar · infinite marquee (translateX 0→−50%, linear) · sits above the header</div>
</body>
</html>
