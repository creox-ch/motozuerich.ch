<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo variants" subtitle="Default / blue / white on surfaces" viewport="700x170" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); }
  .cell { height: 170px; display: grid; place-items: center; position: relative; }
  .cell img { height: 64px; }
  .l { background: #fff; border-right: 1px solid var(--line); }
  .s { background: var(--bg-alt); border-right: 1px solid var(--line); }
  .d { background: var(--night); }
  .tag { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .d .tag { color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
  <div class="row">
    <div class="cell l"><img src="../assets/logo-moto-zuerich.svg" alt="MOTO-ZÜRICH" /><div class="tag">Default · on white</div></div>
    <div class="cell s"><img src="../assets/logo-moto-zuerich-blue.svg" alt="MOTO-ZÜRICH" /><div class="tag">Monochrome blue</div></div>
    <div class="cell d"><img src="../assets/logo-moto-zuerich-white.svg" alt="MOTO-ZÜRICH" /><div class="tag">White · on night</div></div>
  </div>
</body>
</html>
