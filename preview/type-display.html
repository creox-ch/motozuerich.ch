<!DOCTYPE html>
<!-- @dsCard group="Type" name="Display type" subtitle="IBM Plex Sans · ALL-CAPS headlines" viewport="700x212" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 28px 32px; }
  .eyebrow { font-family: var(--font-mono); font-weight: 700; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--brand); margin-bottom: 14px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: 0.9; letter-spacing: -0.01em; text-transform: uppercase; color: var(--fg); margin: 0; }
  .meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 18px; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="eyebrow">IBM Plex Sans · Display 700</div>
  <h1>Erleben.<br />Entdecken.</h1>
  <div class="meta">clamp(44px → 92px) · line-height 0.95 · tracking −0.01em · UPPERCASE</div>
</body>
</html>
