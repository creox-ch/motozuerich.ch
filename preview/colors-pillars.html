<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Pillar signifiers" subtitle="Each event pillar's signifier color" viewport="700x152" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); }
  .p { padding: 22px 18px 20px; border-right: 1px solid var(--line); position: relative; min-height: 150px; }
  .p:last-child { border-right: none; }
  .num { position: absolute; top: 12px; right: 14px; font-family: var(--font-display); font-weight: 700; font-size: 46px; line-height: 0.8; color: rgba(48,102,161,0.10); }
  .dot { width: 16px; height: 16px; margin-bottom: 14px; }
  .tag { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .ttl { font-family: var(--font-display); font-weight: 700; font-size: 19px; text-transform: uppercase; line-height: 1.05; margin: 8px 0 4px; color: var(--fg); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <div class="grid">
    <div class="p"><div class="num">01</div><div class="dot" style="background: var(--brand);"></div><div class="tag">EG · StageOne</div><div class="ttl">Markenwelt</div><div class="hex">--brand</div></div>
    <div class="p"><div class="num">02</div><div class="dot" style="background: var(--brand-light);"></div><div class="tag">Bühne · StageOne</div><div class="ttl">Live Arena</div><div class="hex">--brand-light</div></div>
    <div class="p"><div class="num">03</div><div class="dot" style="background: var(--action-yellow);"></div><div class="tag">OG · Halle 550</div><div class="ttl">Action Zone</div><div class="hex">--action-yellow</div></div>
    <div class="p"><div class="num">04</div><div class="dot" style="background: var(--night);"></div><div class="tag">Chicago Bar</div><div class="ttl">Saison­start-Party</div><div class="hex">--night</div></div>
  </div>
</body>
</html>
