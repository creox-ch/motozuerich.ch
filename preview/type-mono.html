<!DOCTYPE html>
<!-- @dsCard group="Type" name="Mono labels & CTAs" subtitle="IBM Plex Mono · tracked uppercase" viewport="700x150" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 28px 32px; }
  .lbl { font-family: var(--font-mono); font-weight: 700; text-transform: uppercase; color: var(--brand); }
  .a { font-size: 14px; letter-spacing: 0.22em; display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .a::before { content: ""; width: 40px; height: 1px; background: var(--brand); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .cta { font-family: var(--font-mono); font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; font-size: 13px; min-height: 44px; padding: 0 22px; display: inline-flex; align-items: center; gap: 10px; }
  .red { background: var(--swiss-red); color: #fff; }
  .blue { background: var(--brand); color: #fff; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; margin-top: 24px; }
</style>
</head>
<body>
  <div class="lbl a">Section Label · Mono 700</div>
  <div class="row">
    <span class="cta red">Aussteller werden <span>→</span></span>
    <span class="cta blue">Feedback teilen</span>
    <span class="lbl" style="font-size:11px;letter-spacing:0.18em;">EG · STAGEONE</span>
  </div>
  <div class="meta">IBM Plex Mono · tracking 0.12–0.22em · CTAs min-height 44–52px · sharp corners</div>
</body>
</html>
