<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo lockup" subtitle="Emblem + wordmark usage" viewport="700x210" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 26px 32px; }
  .lock { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .emblem { height: 90px; }
  .word { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 0.9; letter-spacing: -0.01em; text-transform: uppercase; color: var(--fg); border-left: 1px solid var(--line); padding-left: 22px; }
  .word small { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: var(--brand); margin-top: 8px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; margin-top: 26px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="lock">
    <img class="emblem" src="../assets/logo-moto-zuerich-blue.svg" alt="MOTO-ZÜRICH emblem" />
    <div class="word">MOTO-<br />ZÜRICH<small>Save the Date · Zürich-Oerlikon</small></div>
  </div>
  <div class="meta">Sport-bike emblem + wordmark · always written MOTO-ZÜRICH (caps, hyphen, Umlaut)<br />Keep clearspace ≈ cap-height · recolor per surface (blue / white)</div>
</body>
</html>
