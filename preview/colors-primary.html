<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Primary blues" subtitle="Brand blue scale — primary → soft" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-mono); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); }
  .sw { height: 200px; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; color: #fff; }
  .name { font-weight: 700; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
  .hex { font-size: 12px; opacity: 0.8; margin-top: 4px; }
  .role { font-family: var(--font-body); font-size: 11px; opacity: 0.7; margin-top: 8px; line-height: 1.3; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--brand);">
      <div class="name">Brand</div><div class="hex">#2F65A0</div>
      <div class="role">Primary blue</div>
    </div>
    <div class="sw" style="background: var(--brand-dark);">
      <div class="name">Brand Dark</div><div class="hex">#1F4571</div>
      <div class="role">Emphasis / hover</div>
    </div>
    <div class="sw" style="background: var(--brand-darker);">
      <div class="name">Brand Darker</div><div class="hex">#0E2A4A</div>
      <div class="role">Gradient stop</div>
    </div>
    <div class="sw" style="background: var(--brand-light);">
      <div class="name">Brand Light</div><div class="hex">#549EF0</div>
      <div class="role">Live Arena · on dark</div>
    </div>
    <div class="sw" style="background: var(--brand-soft); color: var(--brand-dark);">
      <div class="name">Brand Soft</div><div class="hex">#E8EFF7</div>
      <div class="role">Tinted fills</div>
    </div>
  </div>
</body>
</html>
