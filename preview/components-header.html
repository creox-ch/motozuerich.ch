<!DOCTYPE html>
<!-- @dsCard group="Components" name="Header & nav" subtitle="Sticky glass header with red CTA" viewport="700x150" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg-alt); }
  .header { background: rgba(255,255,255,0.96); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .inner { display: flex; justify-content: space-between; align-items: center; gap: 32px; padding: 16px 28px; }
  .logo { height: 44px; }
  nav ul { display: flex; gap: 26px; list-style: none; align-items: center; margin: 0; padding: 0; }
  nav a { color: var(--fg); text-decoration: none; font-family: var(--font-body); font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; }
  nav a.cta { background: var(--swiss-red); color: #fff; padding: 10px 16px; font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.08em; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; padding: 18px 28px; }
</style>
</head>
<body>
  <header class="header">
    <div class="inner">
      <img class="logo" src="../assets/logo-moto-zuerich.svg" alt="MOTO-ZÜRICH" />
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Rückblick 2026</a></li>
          <li><a href="#">Feedback</a></li>
          <li><a href="#" class="cta">Aussteller werden →</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <div class="meta">Sticky glass header (blur 14px, 96% white) · nav links grow an underline on hover · red CTA</div>
</body>
</html>
