<!DOCTYPE html>
<!-- @dsCard group="Components" name="Section header lockup" subtitle="Mono label + caps title + lead" viewport="700x250" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 30px 32px; }
  .label { font-family: var(--font-mono); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.22em; color: var(--brand); margin-bottom: 24px; display: flex; align-items: center; gap: 14px; }
  .label::before { content: ""; width: 40px; height: 1px; background: var(--brand); }
  h2 { font-family: var(--font-display); font-weight: 700; font-size: 56px; line-height: 0.95; letter-spacing: -0.01em; text-transform: uppercase; color: var(--fg); margin: 0 0 22px; }
  .hl { display: inline-block; padding: 0.08em 0.28em; line-height: 1; color: #fff; background: var(--brand); }
  p { font-family: var(--font-body); font-size: 17px; line-height: 1.6; color: var(--fg); max-width: 560px; margin: 0; }
</style>
</head>
<body>
  <div class="label">Über das Event · Für alle</div>
  <h2>Die <span class="hl">MOTO-ZÜRICH</span><br />auf einen Blick</h2>
  <p>Ein urbanes, kuratiertes Drei-Tage-Event in Zürich-Oerlikon — kompakt statt überdimensioniert.</p>
</body>
</html>
