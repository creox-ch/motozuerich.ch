<!DOCTYPE html>
<!-- @dsCard group="Components" name="Press cards" subtitle="Vertical hover wipe to brand" viewport="700x210" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 26px 32px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 24px 22px; min-height: 150px; border: 1px solid var(--line-strong); background: #fff; color: var(--fg); text-decoration: none; transition: all 0.3s cubic-bezier(0.16,1,0.3,1); }
  .card::before { content: ""; position: absolute; inset: 0; background: var(--brand); transform: translateY(100%); transition: transform 0.45s cubic-bezier(0.65,0,0.35,1); z-index: 0; }
  .card:hover::before { transform: translateY(0); }
  .card:hover { color: #fff; border-color: var(--brand); }
  .card > * { position: relative; z-index: 1; }
  .src { font-family: var(--font-mono); font-size: 11px; color: var(--brand); text-transform: uppercase; letter-spacing: 0.18em; font-weight: 700; margin-bottom: 12px; transition: color 0.3s; }
  .card:hover .src { color: var(--action-yellow); }
  .ttl { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.15; text-transform: uppercase; margin-bottom: 16px; }
  .arr { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); font-weight: 700; transition: all 0.3s; }
  .card:hover .arr { color: var(--action-yellow); transform: translateX(6px); }
</style>
</head>
<body>
  <div class="grid">
    <a class="card"><div class="src">Blick</div><div class="ttl">Publikumserfolg an der 1. MOTO-ZÜRICH</div><div class="arr">Artikel lesen →</div></a>
    <a class="card"><div class="src">Tages-Anzeiger</div><div class="ttl">Neue Motorradmesse in Oerlikon</div><div class="arr">Artikel lesen →</div></a>
    <a class="card"><div class="src">1000PS</div><div class="ttl">Fotos und Bericht zur MZ 2026</div><div class="arr">Artikel lesen →</div></a>
  </div>
</body>
</html>
