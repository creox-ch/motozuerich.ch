<!DOCTYPE html>
<!-- @dsCard group="Components" name="Stat counters" subtitle="Bordered stat cells, yellow highlight" viewport="700x160" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--bg); }
  .grid { display: grid; grid-template-columns: 0.85fr 1.3fr 1.3fr; border-top: 2px solid var(--brand); border-bottom: 2px solid var(--brand); }
  .num { padding: 30px 22px; border-right: 1px solid var(--line); text-align: left; background: #fff; }
  .num:last-child { border-right: none; }
  .big { font-family: var(--font-display); font-weight: 700; font-size: 50px; line-height: 1; color: var(--brand); letter-spacing: -0.01em; white-space: nowrap; }
  .lbl { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); line-height: 1.5; margin-top: 12px; }
  .lbl b { color: var(--brand-dark); font-weight: 700; }
</style>
</head>
<body>
  <div class="grid">
    <div class="num"><div class="big">80</div><div class="lbl"><b>Aussteller &amp; Acts</b><br />auf zwei Etagen</div></div>
    <div class="num"><div class="big">10'000 m²</div><div class="lbl"><b>Eventfläche</b><br />StageOne + Halle 550</div></div>
    <div class="num"><div class="big">22'117</div><div class="lbl"><b>Besucher</b><br />MOTO-ZÜRICH 2026</div></div>
  </div>
</body>
</html>
